<script>

  /* Apps Script から配信された場合はここに置き場所のURLが入ります。

    var injected = "__API_URL__";
    window.__KAKEIBO_API__ = injected.indexOf("http") === 0 ? injected : "";
  })();
</script>

.kb *,.kb *::before,.kb *::after{box-sizing:border-box}
.kb{--paper:#F1F4F3;--card:#FFFFFF;--ink:#191D22;--ink2:#5C6771;--ink3:#8A939C;
  --line:#E2E7E5;--indigo:#1F3A5F;--teal:#2F8F8A;--crimson:#B33A3A;--gold:#C9A227;
  background:var(--paper);color:var(--ink);min-height:100vh;padding-bottom:88px;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.55}
.kb button{font-family:inherit;cursor:pointer}
.kb :focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:6px}
.kb .num{font-family:"Roboto Mono","SFMono-Regular",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.kb-head{position:sticky;top:0;z-index:30;background:var(--indigo);color:#EEF2F5;padding:11px 16px;border-bottom:3px solid var(--gold);
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.kb-head h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.28em}
.kb-head .sub{font-size:11px;letter-spacing:.16em;color:#A9BBD0;margin-top:2px}
.kb-head .right{display:flex;align-items:center;gap:6px}
.kb-head .sv{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.kb-head .rf{border:1px solid #4E6E96;background:transparent;color:#CFDCEA;border-radius:999px;font-size:11px;font-weight:800;padding:3px 9px}
.kb-wrap{max-width:860px;margin:0 auto;padding:14px 14px 0}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;color:var(--ink3);font-weight:700;margin:0 0 8px}
.h2{font-size:15px;font-weight:800;margin:0 0 10px}
.muted{color:var(--ink2);font-size:12px}
.hr{height:1px;background:var(--line);margin:12px 0}
.rowline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;line-height:1.2}
.chip.on{color:#fff;border-color:transparent}
.chip.sm{padding:5px 10px;font-size:12px}
.chip.plain.on{background:var(--indigo)}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;line-height:1.2;cursor:pointer}
.filebtn.on{background:var(--indigo);color:#fff;border-color:transparent}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}

.seg{display:flex;background:#E7EBEA;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.10)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pad button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:14px 0;font-size:19px;font-weight:700}
.pad button.alt{background:#F6F8F7;font-size:15px}
.amount{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;border-bottom:2px solid var(--indigo);padding:4px 2px 8px;margin-bottom:10px}
.amount .v{font-size:34px;font-weight:800}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}

.cal{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .wd{font-size:10.5px;color:var(--ink3);padding:4px 0;font-weight:700}
.cal-grid button{border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:13.5px;color:var(--ink)}
.cal-grid button.on{background:var(--indigo);color:#fff;font-weight:800}
.cal-grid button.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}

.field{border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:14px;width:100%;background:#fff;color:var(--ink);font-family:inherit}
textarea.field{min-height:120px;font-size:12.5px;line-height:1.5}
.save{width:100%;border:0;border-radius:12px;padding:15px;background:var(--indigo);color:#fff;font-size:15.5px;font-weight:800;letter-spacing:.06em}
.save.danger{background:#fff;color:var(--crimson);border:1px solid #F0C9C9;font-size:14px;padding:12px}
.ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.ghost.tiny{padding:5px 9px;font-size:11px}

.ledger{border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);
  width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.lrow:active{background:#F6F8F7}
.lrow .d{font-size:11px;color:var(--ink3);text-align:center;line-height:1.2}
.lrow .t1{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lrow .t2{font-size:11.5px;color:var(--ink2);margin-top:1px}
.lrow .a{font-size:14.5px;font-weight:800;text-align:right;white-space:nowrap}
.lrow .edit{font-size:10.5px;color:var(--ink3);margin-top:3px;font-weight:700}
.dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.tag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;background:#EEF1F0;color:var(--ink2)}
.tag.warn{background:#FDECEC;color:#B33A3A}
.tag.ok{background:#E7F4F2;color:#22706C}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.kpi .l{font-size:10.5px;letter-spacing:.1em;color:var(--ink3);font-weight:700}
.kpi .v{font-size:19px;font-weight:800;margin-top:2px}
.kpi .d{font-size:10.5px;font-weight:700;margin-top:1px}

.flowbar{display:flex;height:30px;border-radius:8px;overflow:hidden;background:#E7EBEA}
.flowbar div{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#fff;font-weight:800;min-width:0}
.flowlegend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.flowlegend span{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:5px}

.legend{margin-top:6px}
.lgrow{display:grid;grid-template-columns:12px 1fr auto 58px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.lgrow .p{color:var(--ink3);text-align:right;font-size:11px}

.bud{margin-bottom:11px}
.budtop{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:4px}
.budbar{height:9px;border-radius:999px;background:#E7EBEA;overflow:hidden}
.budbar i{display:block;height:100%;border-radius:999px}

.banner{background:#FFF8E6;border:1px solid #E9D9A3;border-radius:12px;padding:11px 12px;margin-bottom:12px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed #E9D9A3;font-size:12.5px}
.brow:first-of-type{border-top:0}
.alert{background:#FDECEC;border:1px solid #F0C9C9;border-radius:12px;padding:11px 12px;margin-bottom:12px;font-size:12.5px;color:#8C1F1F}
.note{background:#EEF4FA;border:1px solid #CBDCEC;border-radius:12px;padding:11px 12px;margin-bottom:12px;font-size:12.5px;color:#284A70}

.thumb{width:80px;height:80px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(20,24,28,.88);display:flex;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:12px}
.overlay img,.overlay video{max-width:100%;max-height:70vh;border-radius:10px;background:#000}
.sheet{position:fixed;inset:0;z-index:65;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-head{position:sticky;top:0;background:rgba(241,244,243,.97);border-bottom:1px solid var(--line);padding:11px 14px;display:flex;
  justify-content:space-between;align-items:center;backdrop-filter:blur(6px);z-index:2}
.sheet-head b{font-size:14px}
.sheet-body{max-width:860px;margin:0 auto;padding:14px}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;padding:6px 2px 8px;backdrop-filter:blur(8px)}
.nav button{flex:1;border:0;background:transparent;padding:6px 0;border-radius:10px;font-size:10.5px;font-weight:800;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .g{font-size:16px;line-height:1}
.nav button.on{color:var(--indigo)}
.periodnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.periodnav b{font-size:17px;font-weight:800}
.periodnav button{border:1px solid var(--line);background:#fff;border-radius:9px;width:38px;height:34px;font-size:15px;color:var(--ink2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:80;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;max-width:88%;text-align:center}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 6px;text-align:left;white-space:nowrap}
.tbl th{background:#F6F8F7;font-size:10.5px;color:var(--ink2)}
.scrollx{overflow-x:auto}
